<div class="card">
  <a [routerLink]="['/product', product.id]">
    <div class="image placeholder"></div>
  </a>

  <div class="info">
    <h3>{{ product.name }}</h3>
    <p class="price">₹{{ product.price }}</p>

    <button class="order-btn" (click)="orderNow()">
      🟢 Order on WhatsApp
    </button>
  </div>
</div>
